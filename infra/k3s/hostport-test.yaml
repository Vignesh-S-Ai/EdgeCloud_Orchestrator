apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostport-test
  namespace: edgecloud
  labels:
    app: hostport-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostport-test
  template:
    metadata:
      labels:
        app: hostport-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              hostPort: 8080
