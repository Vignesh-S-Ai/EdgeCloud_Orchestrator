apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: edgecloud
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: scheduler
          image: 325580898273.dkr.ecr.ap-south-1.amazonaws.com/edgecloud/scheduler:latest
          ports:
            - containerPort: 8002
          env:
            - name: SCHEDULER_PORT
              value: "8002"
            - name: SCHEDULER_LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 200Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            failureThreshold: 15
            periodSeconds: 3
