apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: edgecloud
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      nodeSelector:
        node-role: cloud
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: scheduler
          image: 171743139339.dkr.ecr.ap-south-1.amazonaws.com/edgecloud/scheduler:o56-hysteresis-20261127
          ports:
            - containerPort: 8002
          env:
            - name: SCHEDULER_PORT
              value: "8002"
            - name: SCHEDULER_LOG_LEVEL
              value: "INFO"
            - name: SCHEDULER_METRICS_TTL_SEC
              value: "2"
            - name: SCHEDULER_HYSTERESIS_MARGIN_PERCENT
              value: "5"
            - name: SCHEDULER_PLACEMENT_STATE_TTL_SEC
              value: "300"
            - name: SCHEDULER_PLACEMENT_STATE_MAX_ENTRIES
              value: "10000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 200Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            failureThreshold: 15
            periodSeconds: 3
